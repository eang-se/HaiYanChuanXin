# Mobile host shares the application API while serving its own frontend build.
server {
    listen 80;
    server_name m.haiyan.eang.fun;
    location ^~ /.well-known/acme-challenge/ { root /var/www/haiyan-acme; }
    location / { return 308 https://m.haiyan.eang.fun$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name m.haiyan.eang.fun;
    ssl_certificate /etc/letsencrypt/live/haiyan-mobile/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haiyan-mobile/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    limit_req_status 429;
    root /var/www/haiyan-mobile/current;
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /index.html { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location ^~ /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff; }
    location ^~ /brand/ { try_files $uri =404; add_header Cache-Control "public, max-age=86400, must-revalidate"; }
    location = /favicon.svg { try_files $uri =404; add_header Cache-Control "public, max-age=86400, must-revalidate"; }
    location = /actuator/health { return 404; }
    location ~ ^/api/auth/(login|quick-login|register|password-reset)$ { limit_req zone=haiyan_login burst=20 nodelay; include /etc/nginx/haiyan-proxy.inc; }
    location ~ ^/api/auth/(verification-code|password-reset/code)$ { limit_req zone=haiyan_mail burst=5 nodelay; include /etc/nginx/haiyan-proxy.inc; }
    location / { include /etc/nginx/haiyan-proxy.inc; }
}
